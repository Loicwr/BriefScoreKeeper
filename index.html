<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Keeper</title>
    <link rel="stylesheet" href="./sass/main.css">
</head>
<body>
    <main>
        <h1>Score Keeper</h1>

        <p>
            <span id="scoreP1">0</span> à <span id="scoreP2"></span>
        </p>
        <label for="scoreMaximun">Score à atteindre : </label>
        <input type="number" id="scoreMaximun" min="1" value="5">

        <div class="buttons">
            <button id="buttonP1">Joueur 1</button>
            <button id="buttonP2">Joueur 2</button>
            <button id="buttonReset">Reset</button>
        </div>
    </main>
    <script src="./JavaScript/index.js"></script>
</body>
</html>
